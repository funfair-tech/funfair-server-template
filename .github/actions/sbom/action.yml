--- # Software Bill of Materials (SBOM) Action
# Maintain in repo: funfair-server-template
name: 'Run Software Bill of Materials'
description: 'Software Bill of materials'
inputs:
  repo-visibility:
    description: 'Visibility of the repo (public or private)'
    required: true

runs:
  using: "composite"
  steps:
    - name: "Install Syft"
      shell: bash
      run: curl -sSfL "https://raw.githubusercontent.com/anchore/syft/v1.51.1/install.sh" | sh -s -- -b "${{runner.temp}}/syft-bin" v1.51.1

    - name: "Add Syft to PATH"
      shell: bash
      run: echo "${{runner.temp}}/syft-bin" >> "$GITHUB_PATH"

    - name: "Create SBOM"
      shell: bash
      working-directory: ${{github.workspace}}
      run: syft "dir:${{github.workspace}}" -c "${{github.workspace}}/.github/linters/syft.yml" -o "spdx-json=${{github.event.repository.name}}-sbom.spdx.json"

    - name: "Scan SBOM (public repo)"
      if: inputs.repo-visibility == 'public'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: "sbom"
        scan-ref: "${{github.event.repository.name}}-sbom.spdx.json"
        format: "sarif"
        output: "${{github.workspace}}/results/${{github.event.repository.name}}-sbom.sarif"
        ignore-unfixed: true
        severity: "HIGH,CRITICAL"
        cache-dir: "${{github.workspace}}/.trivy-cache"

    - name: "Scan SBOM (private repo)"
      if: inputs.repo-visibility != 'public'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: "sbom"
        scan-ref: "${{github.event.repository.name}}-sbom.spdx.json"
        format: "table"
        ignore-unfixed: true
        severity: "HIGH,CRITICAL"
        cache-dir: "${{github.workspace}}/.trivy-cache"
