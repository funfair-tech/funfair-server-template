--- # Build and deploy packages
# Maintain in repo: funfair-server-template
name: 'Publish to nuget'
description: 'Publishes Nuget packages, with or without a separate symbol feed'
inputs:
  nuget-feed:
    description: 'Nuget feed to push packages to'
    required: true
  nuget-symbol-feed:
    description: 'Nuget feed to push packages symbols to'
    required: false
  nuget-api-key:
    description: 'API key to authenticate when pushing packages'
    required: true

runs:
  using: "composite"
  steps:

    - name: "NuGet Push with Symbols"
      if: inputs.nuget-symbol-feed == '' || inputs.nuget-symbol-feed == ' '
      uses: ./.github/actions/dotnet-tool-run
      with:
        working-directory: "${{github.workspace}}"
        tool-name: "pushpackages"
        tool-arguments: "--folder dist --api-key \"${{inputs.nuget-api-key}}\" --source \"${{inputs.nuget-feed}}\""

# yamllint disable rule:line-length
    - name: "NuGet Push with Separate Symbol Feed"
      if: |-
        !(inputs.nuget-symbol-feed == '' || inputs.nuget-symbol-feed == ' ')
      uses: ./.github/actions/dotnet-tool-run
      with:
        working-directory: "${{github.workspace}}"
        tool-name: "pushpackages"
        tool-arguments: "--folder dist --api-key \"${{inputs.nuget-api-key}}\" --source \"${{inputs.nuget-feed}}\" --symbol-source \"${{inputs.nuget-symbol-feed}}\""
# yamllint enable rule:line-length
