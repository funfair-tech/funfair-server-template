--- # Push packages in dist to a NuGet feed
# Maintain in repo: funfair-server-template
name: "Publish to nuget"
description: "Publishes Nuget packages"
inputs:
  nuget-feed:
    description: "Nuget feed to push packages to"
    required: true
  nuget-api-key:
    description: "API key to authenticate when pushing packages"
    required: true

runs:
  using: "composite"
  steps:

    - name: "Check Required Secrets: nuget-api-key"
      uses: ./.github/actions/check-required-secret
      with:
        secret-name: "nuget-api-key"
        secret-value: "${{inputs.nuget-api-key}}"

    - name: "NuGet Push"
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE"
        if ! compgen -G "dist/*.nupkg" > /dev/null; then
          echo "::error::No .nupkg files found in $GITHUB_WORKSPACE/dist"
          exit 1
        fi
        dotnet nuget push "dist/*.nupkg" --source "$NUGET_FEED" --api-key "$NUGET_API_KEY" --skip-duplicate
      env:
        NUGET_FEED: "${{inputs.nuget-feed}}"
        NUGET_API_KEY: "${{inputs.nuget-api-key}}"
