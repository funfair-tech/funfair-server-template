--- # Build and deploy packages
# Maintain in repo: funfair-server-template
name: 'Publish to nuget'
description: 'Publishes Nuget packages, with or without a separate symbol feed'
inputs:
  nuget-feed:
    description: 'Nuget feed to push packages to'
    required: true
  nuget-symbol-feed:
    description: 'Nuget feed to push packages symbols to'
    required: false
  nuget-api-key:
    description: 'API key to authenticate when pushing packages'
    required: true

runs:
  using: "composite"
  steps:

    - name: "Determine symbol source argument"
      shell: bash
      env:
        NUGET_SYMBOL_FEED: ${{inputs.nuget-symbol-feed}}
      run: |
        if [ -n "${NUGET_SYMBOL_FEED}" ] && [ "${NUGET_SYMBOL_FEED}" != " " ]; then
          echo "NUGET_SYMBOL_SOURCE_ARG=--symbol-source \"${NUGET_SYMBOL_FEED}\"" >> "$GITHUB_ENV"
        else
          echo "NUGET_SYMBOL_SOURCE_ARG=" >> "$GITHUB_ENV"
        fi

# yamllint disable rule:line-length
    - name: "NuGet Push"
      uses: ./.github/actions/dotnet-tool-run
      with:
        working-directory: "${{github.workspace}}"
        tool-name: "pushpackages"
        tool-arguments: "--folder dist --api-key \"${{inputs.nuget-api-key}}\" --source \"${{inputs.nuget-feed}}\" ${{env.NUGET_SYMBOL_SOURCE_ARG}}"
# yamllint enable rule:line-length
