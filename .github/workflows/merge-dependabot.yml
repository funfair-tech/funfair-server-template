name: "Dependabot: Merge updates"
on:
  # https://securitylab.github.com/research/github-actions-preventing-pwn-requests
  # could and should work, at least for public repos;
  # tracking issue for this action's issue:
  # https://github.com/ahmadnassri/action-dependabot-auto-merge/issues/60
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  status: { }

permissions:
  contents: read

jobs:
  auto-merge-dependabot-github-actions:

    if: |-
      vars.DEPENDABOT_AUTOMERGE == 'true' &&
      startsWith(github.head_ref, 'dependabot/github_actions/')
    runs-on: [self-hosted, linux, build]

    permissions:
      contents: write
      pull-requests: write

    # Specifically check that dependabot (or another trusted party) created this pull-request, and that it has been labelled correctly.

    steps:
      - name: "Initialise Workspace"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE"

      - name: "Set Active Environment"
        shell: bash
        run: |
          {
            echo "ACTIVE_RUNNER_NAME=${{runner.name}}"
            echo "ACTIVE_HOSTNAME=$HOSTNAME"
            echo "ACTIVE_USER=$USER"
          } >> "$GITHUB_ENV"

      - name: "Check Owner"
        uses: actions/github-script@v9.0.0
        with:
          script: |
            core.info('Owner: ${{github.repository_owner}}');

      - name: "Check Required Secrets"
        if: github.repository_owner == 'funfair-tech'
        shell: bash
        run: |
          if [ -z "${{secrets.SOURCE_PUSH_TOKEN}}" ]; then
            echo "::error::SOURCE_PUSH_TOKEN is required but not set"
            exit 1
          fi

      - name: "Check Labels"
        if: github.repository_owner == 'funfair-tech'
        id: check-labels
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.setOutput('has-label', 'false');
              return;
            }
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const labels = pr.data.labels.map(l => l.name);
            core.setOutput('has-label', labels.includes('github-actions') ? 'true' : 'false');

      - name: "Auto-Merge"
        if: github.repository_owner == 'funfair-tech' && steps.check-labels.outputs.has-label == 'true'
        env:
          GH_TOKEN: ${{secrets.SOURCE_PUSH_TOKEN}}
        shell: bash
        run: |
          gh pr merge "${{github.event.pull_request.number}}" \
            --merge \
            --delete-branch
