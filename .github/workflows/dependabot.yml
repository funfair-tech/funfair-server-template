name: "Dependabot: Rebase"
on:
  push:
    branches:
      - main
  release:
    types: [published]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true


jobs:
  auto-rebase:
    runs-on: [self-hosted, linux, build]

    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    timeout-minutes: 5
    steps:
      - name: "Check Required Secrets"
        uses: actions/github-script@v9.0.0
        env:
          TOKEN: ${{secrets.SOURCE_PUSH_TOKEN}}
        with:
          script: |
            if (!process.env.TOKEN) {
              core.setFailed('❌ SOURCE_PUSH_TOKEN is required but not set');
            } else {
              core.info('✅ SOURCE_PUSH_TOKEN is set');
            }

      - name: "Initialise Workspace"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE"

      - name: "Set Active Environment"
        shell: bash
        run: |
          {
            echo "ACTIVE_RUNNER_NAME=${{runner.name}}"
            echo "ACTIVE_HOSTNAME=$HOSTNAME"
            echo "ACTIVE_USER=$USER"
          } >> "$GITHUB_ENV"

      - name: "Rebase"
        uses: bbeesley/gha-auto-dependabot-rebase@v1.5.225
        env:
          GITHUB_TOKEN: ${{secrets.SOURCE_PUSH_TOKEN}}
